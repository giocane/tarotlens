<script>
function escapeHTML(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function formatDesc(s) {
    return escapeHTML(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

const heroVideoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
            if (!video.src && video.dataset.src) video.src = video.dataset.src;
            video.play().catch(() => {});
        } else {
            video.pause();
        }
    });
}, { threshold: 0.25 });

const revealObserver = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); revealObserver.unobserve(e.target); } });
}, { threshold: 0.12 });

const HERO_MEDIA_VIDEO_RE = /\.(mp4|mov)$/i;

function renderHero(products) {
    const container = document.getElementById('heroContainer');
    if (!container || !products) return;
    const { pick, t } = window.TarotLensI18n;
    const featured = products.filter(p => p.hero && p.cat !== 'variante' && !estTermine(p));

    container.innerHTML = featured.map((p, i) => {
        const media = (p.images || []).find(src => HERO_MEDIA_VIDEO_RE.test(src)) || p.img;
        const mediaHTML = media && HERO_MEDIA_VIDEO_RE.test(media)
            ? `<video data-src="${escapeHTML(media)}" preload="none" muted loop playsinline></video>`
            : media ? `<img src="${escapeHTML(media)}" alt="">` : '';
        const displayName = pick(p, 'name');
        const titleHTML = (p.badge === 'new' ? 'NEW<br>' : '') + escapeHTML(displayName.toUpperCase());
        const titleTag = i === 0 ? 'h1' : 'h2';
        return `
        <section class="hero-feature${i % 2 ? ' rev' : ''}">
            <div class="hero-copy">
                <${titleTag} class="hero-title${i % 2 ? ' magenta' : ''}">${titleHTML}</${titleTag}>
                <a href="#${p.cat === 'accessory' ? 'accessoires' : 'decks'}" class="btn btn-orange">${escapeHTML(t('hero_cta'))}</a>
            </div>
            <div class="hero-media">${mediaHTML}</div>
        </section>`;
    }).join('');

    container.querySelectorAll('.hero-feature').forEach(el => {
        el.classList.add('reveal');
        revealObserver.observe(el);
    });
    container.querySelectorAll('.hero-media video[data-src]').forEach(v => heroVideoObserver.observe(v));
}

const toast = document.getElementById('toast');
let toastTimer;
const SEUIL_STOCK_FAIBLE = 5;

function optionsDe(p) { return Array.isArray(p.options) ? p.options : []; }

function formatPrix(n) {
    return Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.', ',');
}

function aujourdhuiParis() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Paris' });
}

function estTermine(p) {
    return !!p.endsAt && aujourdhuiParis() > p.endsAt;
}

function formatDateFin(s) {
    const [y, m, d] = s.split('-');
    if (document.documentElement.lang === 'en') {
        return new Date(Date.UTC(+y, +m - 1, +d)).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    }
    return `${d}/${m}/${y}`;
}

function pastillesHTML(p, avecNouveau) {
    const { t } = window.TarotLensI18n;
    const liste = [];
    if (avecNouveau && p.badge === 'new') liste.push(`<span class="prod-card-badge-new">${escapeHTML(t('badge_new'))}</span>`);
    if (p.preorder) liste.push(`<span class="prod-card-badge-pre">${escapeHTML(t('badge_preorder'))}</span>`);
    if (p.endsAt) liste.push(`<span class="prod-card-badge-pre until">${escapeHTML(t('offer_untilShort').replace('{d}', formatDateFin(p.endsAt)))}</span>`);
    return liste.join('');
}

function prixOptionHTML(o) {
    return o.oldPrice > o.price
        ? `<s class="opt-old-price">${formatPrix(o.oldPrice)} €</s> <strong>${formatPrix(o.price)} €</strong>`
        : `<strong>${formatPrix(o.price)} €</strong>`;
}

function addToCartById(id, optIdx) {
    const p = window.PRODUCTS.find(x => x.id === id);
    if (!p) return;
    const { pick, t } = window.TarotLensI18n;
    const displayName = pick(p, 'name');
    const option = optionsDe(p).length ? optionsDe(p)[optIdx] : null;
    if (optionsDe(p).length && !option) return;
    const nomAffiche = option ? `${displayName} — ${pick(option, 'label')}` : displayName;
    window.ArcanaCart.add(option
        ? { key: `p${p.id}-o${optIdx}`, id: p.id, opt: optIdx, optLabel: option.label, optLabel_en: option.label_en || '', name: displayName, price: option.price, oldPrice: option.oldPrice, glyph: p.glyph, grad: p.grad, img: p.img, meta: pick(p, 'tag') }
        : { id: p.id, name: displayName, price: p.price, glyph: p.glyph, grad: p.grad, img: p.img, meta: pick(p, 'tag') });
    document.querySelectorAll('.nav-badge').forEach(b =>
        b.animate([{ transform: 'scale(1.6)' }, { transform: 'scale(1)' }], { duration: 300 })
    );
    toast.textContent = t('toast_added').replace('{name}', nomAffiche);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function notifyFormHTML(t) {
    return `
        <form class="notify-form">
            <input type="email" required placeholder="${t('stock_notifyPlaceholder')}">
            <button type="submit" class="btn btn-ghost sm">${t('stock_notifySubmit')}</button>
        </form>
        <p class="notify-msg" hidden></p>`;
}


function wireNotifyForm(container, product) {
    const form = container.querySelector('.notify-form');
    const msg = container.querySelector('.notify-msg');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const { t, pick } = window.TarotLensI18n;
        const input = form.querySelector('input');
        const btn = form.querySelector('button');
        btn.disabled = true;
        btn.textContent = t('stock_notifySending');
        try {
            const res = await fetch(window.TAROTLENS_ENDPOINT, {
                method: 'POST',
                body: JSON.stringify({ type: 'stock_interest', email: input.value, product: pick(product, 'name'), lang: document.documentElement.lang || 'fr' }),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || 'unknown');
            form.hidden = true;
            msg.textContent = t('stock_notifyThanks');
            msg.classList.remove('error');
            msg.hidden = false;
        } catch (err) {
            btn.disabled = false;
            btn.textContent = t('stock_notifySubmit');
            msg.textContent = t('stock_notifyError');
            msg.classList.add('error');
            msg.hidden = false;
        }
    });
}

function disponibiliteSimple(p) {
    if (p.comingSoon) return { tracked: false, qty: null, out: true };
    const q = window.ArcanaStock.qty(p.id);
    if (q !== null) return { tracked: true, qty: q, out: q <= 0 };
    return { tracked: false, qty: null, out: p.inStock === false };
}

function getOptionAvailability(p, o) {
    const ids = o.ids && o.ids.length ? o.ids : [p.id];
    const dispos = ids.map(id => {
        const composant = window.PRODUCTS.find(x => x.id === id);
        return composant ? disponibiliteSimple(composant) : { tracked: false, qty: null, out: true };
    });
    const quantites = dispos.filter(d => d.tracked).map(d => d.qty);
    return {
        tracked: quantites.length > 0,
        qty: quantites.length ? Math.min(...quantites) : null,
        out: p.comingSoon === true || dispos.some(d => d.out),
    };
}

function getAvailability(p) {
    const opts = optionsDe(p);
    if (!opts.length || p.comingSoon) return disponibiliteSimple(p);
    return { tracked: false, qty: null, out: opts.every(o => getOptionAvailability(p, o).out) };
}

let stockChecked = false;

function renderStockStates() {
    const { t } = window.TarotLensI18n;
    document.querySelectorAll('.prod-card[data-id]').forEach(card => {
        const p = window.PRODUCTS.find(x => x.id === +card.dataset.id);
        const actions = card.querySelector('.prod-card-actions');
        if (!p) return;
        const avail = getAvailability(p);
        const lowStock = avail.tracked && !avail.out && avail.qty <= SEUIL_STOCK_FAIBLE;
        if (!avail.out && !lowStock) {
            actions.querySelector('[data-action="add"]').disabled = false;
            return;
        }

        if (avail.out) {
            if (!p.comingSoon) card.classList.add('out-of-stock');
            const addBtn = actions.querySelector('.btn-magenta');

            const badge = document.createElement('span');
            badge.className = 'stock-badge';
            badge.textContent = t(p.comingSoon ? 'stock_comingSoon' : 'stock_outOfStock');
            actions.before(badge);

            const notifyBtn = document.createElement('button');
            notifyBtn.type = 'button';
            notifyBtn.className = 'btn btn-ghost sm';
            notifyBtn.textContent = t('stock_notifySubmit');
            notifyBtn.addEventListener('click', () => openStockModal(p));
            addBtn.replaceWith(notifyBtn);
        } else {
            actions.querySelector('[data-action="add"]').disabled = false;
            const badge = document.createElement('span');
            badge.className = 'stock-badge low';
            badge.textContent = t('stock_lowBadge').replace('{n}', avail.qty);
            actions.before(badge);
        }
    });
    stockChecked = true;
}
function renderProducts(products) {
    const { pick, t } = window.TarotLensI18n;
    const decksGrid = document.querySelector('#decks .products-grid');
    const accessoiresGrid = document.querySelector('#accessoires .products-grid');
    if (!decksGrid || !accessoiresGrid || !products) return;

    const prixCarte = p => optionsDe(p).length
        ? t('price_from').replace('{p}', formatPrix(Math.min(...optionsDe(p).map(o => o.price))))
        : `${p.price} €`;
    const boutonCarte = p => optionsDe(p).length ? (pick({ cta: p.optionsCta, cta_en: p.optionsCta_en }, 'cta') || t('btn_chooseOption')) : t('btn_addToCart');

    const cardHTML = p => `
        <div class="prod-card${p.comingSoon ? ' coming-soon' : ''}" data-id="${p.id}">
            <div class="prod-card-head">
                <p class="prod-card-name">${escapeHTML(pick(p, 'name'))}</p>
                <span class="prod-card-price">${escapeHTML(prixCarte(p))}</span>
            </div>
            <div class="prod-card-media">
                ${(h => h ? `<div class="prod-card-badges">${h}</div>` : '')(pastillesHTML(p, true))}
                ${p.img && !/\.(mp4|mov)$/i.test(p.img) ? `<img src="${escapeHTML(p.img)}" alt="${escapeHTML(pick(p, 'name'))}" loading="lazy">` : `<span class="prod-card-media-glyph">${escapeHTML(p.glyph || '')}</span>`}
            </div>
            <div class="prod-card-actions">
                <button type="button" class="btn btn-magenta sm" data-action="add" disabled>${escapeHTML(boutonCarte(p))}</button>
                <button type="button" class="btn btn-ghost sm" data-action="learn">${t('btn_learnMore')}</button>
            </div>
        </div>`;

    decksGrid.innerHTML = products.filter(p => p.cat !== 'accessory' && p.cat !== 'variante' && !estTermine(p)).map(cardHTML).join('');
    accessoiresGrid.innerHTML = products.filter(p => p.cat === 'accessory' && !estTermine(p)).map(cardHTML).join('');

    [decksGrid, accessoiresGrid].forEach(grid => {
        grid.querySelectorAll('.prod-card').forEach(card => {
            const id = +card.dataset.id;
            const produit = products.find(x => x.id === id);
            card.querySelector('[data-action="add"]').addEventListener('click', () => {
                if (produit && optionsDe(produit).length) openProductModal(id);
                else addToCartById(id);
            });
            card.querySelector('[data-action="learn"]').addEventListener('click', () => openProductModal(id));
        });
    });
}

renderProducts(window.PRODUCTS);
renderHero(window.PRODUCTS);
window.ArcanaProducts.load().then(produits => {
    if (produits) { renderProducts(produits); renderHero(produits); }
    return window.ArcanaStock.load();
}).finally(renderStockStates);

function openStockModal(p) {
    const { pick, t } = window.TarotLensI18n;
    stockModalTag.textContent = pick(p, 'tag');
    stockModalTitle.textContent = pick(p, 'name');
    stockModalNotify.innerHTML = notifyFormHTML(t);
    wireNotifyForm(stockModalNotify, p);
    stockModal.classList.add('show');
}

function closeStockModal() {
    stockModal.classList.remove('show');
}

stockModalClose.addEventListener('click', closeStockModal);
stockModal.addEventListener('click', e => { if (e.target === stockModal) closeStockModal(); });
window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && stockModal.classList.contains('show')) closeStockModal();
});

const modalAddBtn = document.getElementById('modalAddBtn');
const modalNotify = document.getElementById('modalNotify');
const modalClose = document.getElementById('modalClose');

const modalOptionsList = document.getElementById('modalOptionsList');
const modalOptionDesc = document.getElementById('modalOptionDesc');

let modalImages = [];
let modalImageIndex = 0;
let modalOptionIndex = 0;

function majOptionSelectionnee(p) {
    const { pick } = window.TarotLensI18n;
    modalOptionsList.querySelectorAll('.opt-choice').forEach((el, i) => el.classList.toggle('selected', i === modalOptionIndex));
    const option = optionsDe(p)[modalOptionIndex];
    const desc = option ? pick(option, 'desc') : '';
    modalOptionDesc.innerHTML = desc ? formatDesc(desc) : '';
    modalOptionDesc.hidden = !desc;
}

function renderModalOptions(p) {
    const { pick, t } = window.TarotLensI18n;
    const opts = optionsDe(p);
    modalOptions.hidden = !opts.length;
    if (!opts.length) return;
    modalOptionsTitle.textContent = t('modal_optionsTitle');
    modalOptionsList.innerHTML = opts.map((o, i) => {
        const dispo = stockChecked ? getOptionAvailability(p, o) : { out: false, tracked: false, qty: null };
        const faible = dispo.tracked && !dispo.out && dispo.qty <= SEUIL_STOCK_FAIBLE;
        const note = dispo.out ? t('opt_outOfStock') : (faible ? t('stock_lowBadge').replace('{n}', dispo.qty) : '');
        return `
        <label class="opt-choice${dispo.out ? ' out' : ''}">
            <input type="radio" name="modalOption" value="${i}"${i === modalOptionIndex ? ' checked' : ''}${dispo.out ? ' disabled' : ''}>
            <span class="opt-choice-label">${escapeHTML(pick(o, 'label'))}${note ? `<small class="opt-choice-note">${escapeHTML(note)}</small>` : ''}</span>
            <span class="opt-choice-price">${prixOptionHTML(o)}</span>
        </label>`;
    }).join('');
    modalOptionsList.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
        modalOptionIndex = +inp.value;
        majOptionSelectionnee(p);
    }));
    majOptionSelectionnee(p);
}

function renderModalSlide() {
    modalMedia.querySelectorAll('.modal-slide').forEach((el, i) => {
        el.classList.toggle('active', i === modalImageIndex);
        if (el.tagName === 'VIDEO') { i === modalImageIndex ? el.play() : el.pause(); }
    });
    modalMedia.querySelectorAll('.modal-dot').forEach((d, i) => d.classList.toggle('active', i === modalImageIndex));
}

function buildModalMedia(p, displayName) {
    const images = (p.images && p.images.length ? p.images : (p.img ? [p.img] : []));
    modalImages = images;
    modalImageIndex = 0;
    modalMedia.classList.toggle('coming-soon', !!p.comingSoon);

    if (!images.length) {
        modalMedia.innerHTML = p.glyph;
        return;
    }
    const isVideo = src => /\.(mp4|mov)$/i.test(src);

    if (images.length === 1) {
        modalMedia.innerHTML = isVideo(images[0])
            ? `<video src="${escapeHTML(images[0])}" autoplay muted loop playsinline></video>`
            : `<img src="${escapeHTML(images[0])}" alt="${escapeHTML(displayName)}">`;
        return;
    }

    const { t } = window.TarotLensI18n;
    const slides = images.map((src, i) => isVideo(src)
        ? `<video class="modal-slide" src="${escapeHTML(src)}" muted loop playsinline></video>`
        : `<img class="modal-slide" src="${escapeHTML(src)}" alt="${escapeHTML(displayName)} ${i + 1}">`).join('');
    const dots = images.map((_, i) => `<button type="button" class="modal-dot" data-slide="${i}" aria-label="${t('modal_photoAria').replace('{n}', i + 1)}"></button>`).join('');

    modalMedia.innerHTML = `
        ${slides}
        <button type="button" class="modal-slide-nav prev" aria-label="${t('modal_prevAria')}">‹</button>
        <button type="button" class="modal-slide-nav next" aria-label="${t('modal_nextAria')}">›</button>
        <div class="modal-dots">${dots}</div>
    `;

    modalMedia.querySelector('.prev').onclick = () => { modalImageIndex = (modalImageIndex - 1 + modalImages.length) % modalImages.length; renderModalSlide(); };
    modalMedia.querySelector('.next').onclick = () => { modalImageIndex = (modalImageIndex + 1) % modalImages.length; renderModalSlide(); };
    modalMedia.querySelectorAll('.modal-dot').forEach(dot => dot.onclick = () => { modalImageIndex = +dot.dataset.slide; renderModalSlide(); });

    renderModalSlide();
}

function openProductModal(id) {
    const p = window.PRODUCTS.find(x => x.id === id);
    if (!p) return;
    const { pick, t } = window.TarotLensI18n;
    const displayName = pick(p, 'name');
    const displayDesc = pick(p, 'desc');

    buildModalMedia(p, displayName);
    modalTag.textContent = pick(p, 'tag');
    const pastilles = pastillesHTML(p, false);
    modalPills.innerHTML = pastilles;
    modalPills.hidden = !pastilles;
    modalTitle.textContent = displayName;
    const displayAccroche = pick(p, 'accroche');
    modalAccroche.textContent = displayAccroche || '';
    modalAccroche.style.display = displayAccroche ? '' : 'none';
    modalDesc.innerHTML = displayDesc ? formatDesc(displayDesc) : '';
    modalDesc.style.display = displayDesc ? '' : 'none';

    const points = (pick(p, 'points') || '').split('\n').map(s => s.trim()).filter(Boolean);
    modalPoints.innerHTML = points.map(pt => `<li>${formatDesc(pt)}</li>`).join('');
    modalPoints.style.display = points.length ? '' : 'none';

    const cardsDetail = pick(p, 'cardsDetail');
    const specs = [
        p.cards ? `${p.cards} ${t('unit_cards')}${cardsDetail ? ' : ' + cardsDetail : ''}` : null,
        pick(p, 'format') || null,
        pick(p, 'weight') || null,
        pick(p, 'finition') || null,
        pick(p, 'delivery') || null,
    ].filter(Boolean);
    modalSpecs.textContent = specs.length ? specs.join('\n') : t('modal_descTodo');
    modalSpecs.style.display = !specs.length && optionsDe(p).length ? 'none' : '';

    const opts = optionsDe(p);
    if (opts.length) {
        const premiere = opts.findIndex(o => !stockChecked || !getOptionAvailability(p, o).out);
        modalOptionIndex = premiere >= 0 ? premiere : 0;
    }
    renderModalOptions(p);

    if (!stockChecked) {
        modalAddBtn.style.display = '';
        modalAddBtn.disabled = true;
        modalAddBtn.onclick = null;
        modalNotify.innerHTML = '';
    } else {
        const avail = getAvailability(p);
        if (avail.out) {
            modalAddBtn.style.display = 'none';
            modalNotify.innerHTML = `<span class="stock-badge">${t(p.comingSoon ? 'stock_comingSoon' : 'stock_outOfStock')}</span>` + notifyFormHTML(t);
            wireNotifyForm(modalNotify, p);
        } else {
            modalAddBtn.style.display = '';
            modalAddBtn.disabled = false;
            const faible = !opts.length && avail.tracked && avail.qty <= SEUIL_STOCK_FAIBLE;
            modalNotify.innerHTML = faible
                ? `<span class="stock-badge low">${escapeHTML(t('stock_lowBadge').replace('{n}', avail.qty))}</span>`
                : '';
            modalAddBtn.onclick = () => { addToCartById(id, opts.length ? modalOptionIndex : undefined); closeProductModal(); };
        }
    }
    productModal.classList.add('show');
}

function closeProductModal() {
    productModal.classList.remove('show');
    modalMedia.querySelectorAll('video').forEach(v => v.pause());
}

modalClose.addEventListener('click', closeProductModal);
productModal.addEventListener('click', e => { if (e.target === productModal) closeProductModal(); });
window.addEventListener('keydown', e => {
    if (!productModal.classList.contains('show')) return;
    if (e.key === 'Escape') closeProductModal();
    if (e.key === 'ArrowLeft' && modalImages.length > 1) { modalImageIndex = (modalImageIndex - 1 + modalImages.length) % modalImages.length; renderModalSlide(); }
    if (e.key === 'ArrowRight' && modalImages.length > 1) { modalImageIndex = (modalImageIndex + 1) % modalImages.length; renderModalSlide(); }
});

document.querySelectorAll('.products-section').forEach(el => {
    el.classList.add('reveal');
    revealObserver.observe(el);
});
</script>
</body>
</html>
